info:
  name: Home Feed
  type: http
  seq: 1
  tags:
    - smoke

http:
  method: GET
  url: "{{baseURL}}/"
  headers:
    - name: Accept
      value: text/html
  params:
    - name: sort
      value: hot
      type: query
    - name: t
      value: all
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseURL
      value: http://localhost:3000
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Loads the public home feed with the default hot/all filters.
