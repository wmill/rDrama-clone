info:
  name: Search Comments
  type: http
  seq: 4
  tags:
    - smoke

http:
  method: GET
  url: "{{baseURL}}/search"
  params:
    - name: q
      value: test
      type: query
    - name: type
      value: comments
      type: query
    - name: page
      value: "1"
      type: query
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Runs the public search page in comment mode.
