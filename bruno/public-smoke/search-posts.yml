info:
  name: Search Posts
  type: http
  seq: 3
  tags:
    - smoke

http:
  method: GET
  url: "{{baseURL}}/search"
  params:
    - name: q
      value: test
      type: query
    - name: type
      value: posts
      type: query
    - name: page
      value: "1"
      type: query
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Runs the public search page in post mode.
