info:
  name: Comments Feed
  type: http
  seq: 2
  tags:
    - smoke

http:
  method: GET
  url: "{{baseURL}}/comments"
  params:
    - name: sort
      value: new
      type: query
    - name: t
      value: all
      type: query
    - name: page
      value: "1"
      type: query
  headers:
    - name: Accept
      value: text/html
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Loads the public comments feed with the default new/all filters.
